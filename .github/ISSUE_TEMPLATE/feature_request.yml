name: Idea
description: Something the Discord plugin could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search the open issues and the "Future goals" part of the README first. Your idea may already be planned.
        Some ideas need a change in HolyArrs before a plugin can do them.
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help you
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another bot, a script, or not at all.
  - type: checkboxes
    id: access
    attributes:
      label: New access
      description: Owners approve hosts and permissions at install, so new ones are added with care.
      options:
        - label: This would need the bot to call a new website or get a new HolyArrs permission (tick if you know)
