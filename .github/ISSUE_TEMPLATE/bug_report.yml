name: Bug report
description: Something in the Discord plugin does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search the open issues first, your bug may already be there.
        Security problems are reported privately (see SECURITY.md), never here.
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: Shown on the Plugins page in HolyArrs.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: holyarrs_version
    attributes:
      label: HolyArrs version
      description: Settings > This app, or the image tag.
      placeholder: 1.3.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps that lead to the bug, including the command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: |
        The lines for the plugin from the HolyArrs log. The `selfcheck` lines from the last start help most.
        Read them through before you paste. Remove any bot token, link code, invite link, name or id. Never post a token.
      render: text
